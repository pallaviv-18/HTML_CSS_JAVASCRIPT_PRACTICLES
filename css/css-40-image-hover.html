<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 40 - Image Hover</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #555;
            margin-bottom: 30px;
        }

        .image-box {
            width: 350px;
            height: 250px;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s, filter 0.5s;
        }

        .image-box img:hover {
            transform: scale(1.15);
            filter: brightness(75%);
        }

        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }

        .navigation a {
            background: #333;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }

        @media (max-width: 500px) {
            .image-box {
                width: 100%;
                height: 220px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CSS Experiment 40 - Image Hover</h1>

    <p class="description">
        Move the mouse over the image to see the hover effect.
    </p>

    <div class="image-box">
        <img
            src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=800&q=80"
            alt="Nature Image">
    </div>

    <div class="navigation">
        <a href="css-39-dropdown.html">← Previous</a>
        <a href="index.html">CSS Programs</a>
        <a href="css-41-tooltip.html">Next →</a>
    </div>

</div>

</body>
</html>
