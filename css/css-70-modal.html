<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS 70 - Modal</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:50px;text-align:center}
.modal-button{background:#333;color:white;padding:15px 25px;text-decoration:none;border-radius:5px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.modal:target{display:flex}
.content{background:white;padding:40px;border-radius:12px;width:300px}
.close{background:#e74c3c;color:white;padding:10px;text-decoration:none;border-radius:5px}
.navigation{margin-top:60px;display:flex;justify-content:space-between}
.navigation a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
</style>
</head>
<body>
<h1>CSS-Only Modal</h1>
<a class="modal-button" href="#modal">Open Modal</a>

<div class="modal" id="modal">
<div class="content">
<h2>Hello!</h2>
<p>This modal works using only HTML and CSS.</p>
<a class="close" href="#">Close</a>
</div>
</div>

</div>
</body>
</html>
