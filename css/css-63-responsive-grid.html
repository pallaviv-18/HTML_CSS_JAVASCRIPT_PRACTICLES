<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS 63 - Responsive Grid</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:30px}
.container{max-width:1000px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.item{background:white;padding:40px;text-align:center;border-radius:10px}
.navigation{margin-top:30px;display:flex;justify-content:space-between}
a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>Responsive Grid</h1>
<div class="grid">
<div class="item">1</div><div class="item">2</div>
<div class="item">3</div><div class="item">4</div>
<div class="item">5</div><div class="item">6</div>
<div class="item">7</div><div class="item">8</div>
</div>

</div>
</div>
</body>
</html>
