<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS 57 - Shopping</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#222;color:white;padding:25px;text-align:center}
.products{max-width:1000px;margin:30px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.product{background:white;padding:20px;border-radius:10px;text-align:center}
.product img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.price{font-weight:bold;font-size:20px}
button{background:#222;color:white;padding:10px 20px;border:0;border-radius:5px}
.navigation{max-width:1000px;margin:30px auto;display:flex;justify-content:space-between}
a{background:#222;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
@media(max-width:700px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>My Shopping Store</h1></header>
<div class="products">
<div class="product"><img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"><h2>Watch</h2><p class="price">₹1,499</p><button>Buy Now</button></div>
<div class="product"><img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"><h2>Shoes</h2><p class="price">₹2,499</p><button>Buy Now</button></div>
<div class="product"><img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=600&q=80"><h2>Bag</h2><p class="price">₹1,999</p><button>Buy Now</button></div>
</div>

</div>
</body>
</html>
