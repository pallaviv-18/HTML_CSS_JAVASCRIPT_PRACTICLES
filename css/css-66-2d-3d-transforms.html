<title>CSS 66 - 2D 3D Transforms</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:30px;text-align:center}
.container{max-width:900px;margin:auto;background:white;padding:30px;border-radius:12px}
.boxes{display:flex;gap:50px;justify-content:center;flex-wrap:wrap}
.box{width:150px;height:150px;background:#3498db;color:white;display:flex;align-items:center;justify-content:center;transition:1s}
.two:hover{transform:rotate(45deg) scale(1.1)}
.three:hover{transform:perspective(400px) rotateY(45deg)}
.navigation{margin-top:50px;display:flex;justify-content:space-between}
a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
</style>
</head>
<body>
<div class="container">
<h1>2D and 3D Transforms</h1>
<div class="boxes">
<div class="box two">2D Transform</div>
<div class="box three">3D Transform</div>
