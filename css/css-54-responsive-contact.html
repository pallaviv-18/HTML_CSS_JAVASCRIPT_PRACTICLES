<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS 54 - Responsive Contact</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:30px}
.container{max-width:900px;margin:auto;background:white;padding:30px;border-radius:12px}
.contact{display:flex;gap:30px}.info,.form{flex:1}
input,textarea{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
textarea{height:150px}
button{padding:12px 25px;background:#333;color:white;border:0;border-radius:5px}
.navigation{margin-top:30px;display:flex;justify-content:space-between}
a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
@media(max-width:650px){.contact{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<h1>Contact Us</h1>
<div class="contact">
<div class="info">
<h2>Get in Touch</h2>
<p>Email: student@example.com</p>
<p>Phone: +91 9876543210</p>
<p>Chennai, India</p>
</div>
<div class="form">
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<textarea placeholder="Your Message"></textarea>
<button>Send Message</button>
</div>
</div>

<a href="index.html">CSS Programs</a>
<a href="css-55-responsive-college-homepage.html">Next →</a>
</div>
</div>
</body>
</html>
