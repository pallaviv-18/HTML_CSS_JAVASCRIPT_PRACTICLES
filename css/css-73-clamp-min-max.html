<title>CSS 73 - Clamp Min Max</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:30px}
.container{max-width:900px;margin:auto;background:white;padding:30px;border-radius:12px}
.box{width:min(90%,700px);padding:clamp(20px,5vw,60px);margin:auto;background:#dbeafe}
h1{font-size:clamp(28px,5vw,55px)}
.text{width:max(300px,50%);background:#dcfce7;padding:20px;margin-top:20px}
.navigation{margin-top:30px;display:flex;justify-content:space-between}
a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
</style>
</head>
<body>
<div class="container">
<div class="box">
<h1>Clamp()</h1>
<p>This box uses min(), max() and clamp() for responsive sizing.</p>
</div>
<div class="text">
<p>Responsive width using max().</p>
