<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 42 - Button Hover</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        .description {
            color: #555;
            margin-bottom: 40px;
        }

        .hover-button {
            padding: 15px 35px;
            font-size: 18px;
            background: #3498db;
            color: white;
            border: 2px solid #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .hover-button:hover {
            background: white;
            color: #3498db;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .navigation {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
        }

        .navigation a {
            background: #333;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CSS Experiment 42 - Button Hover</h1>

    <p class="description">
        This button uses only CSS to create a hover effect.
    </p>

    <button class="hover-button">
        Hover Over Me
    </button>

        <a href="css-41-tooltip.html">← Previous</a>
        <a href="index.html">CSS Programs</a>
        <a href="css-43-filters.html">Next →</a>
    </div>

</div>

</body>
</html>
