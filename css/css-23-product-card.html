<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-card {
            width: 320px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        }

        .product-image {
            height: 220px;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .product-details {
            padding: 22px;
        }

        .product-details h2 {
            color: #222;
            margin-bottom: 8px;
        }

        .description {
            color: #666;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .rating {
            color: #f59e0b;
            margin-bottom: 12px;
        }

        .price {
            font-size: 24px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 18px;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .buy-btn:hover {
            background: #3730a3;
        }

        .navigation {
            position: fixed;
            bottom: 20px;
            text-align: center;
        }

        .navigation a {
            color: #4f46e5;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .product-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="product-card">

        <div class="product-image">
            🎧
        </div>

        <div class="product-details">

            <h2>Wireless Headphones</h2>

            <p class="description">
                Comfortable wireless headphones with clear sound,
                stylish design and long-lasting battery.
            </p>

            <div class="rating">
                ★★★★★
            </div>

            <div class="price">
                ₹1,999
            </div>

            <button class="buy-btn">
                Add to Cart
            </button>

        </div>

    </div>

    <div class="navigation">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to CSS Programs</a>
    </div>

</body>
</html>
