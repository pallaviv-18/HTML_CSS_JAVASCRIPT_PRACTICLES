<title>CSS 46 - Card Flexbox</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:30px}
.container{max-width:1000px;margin:auto;background:white;padding:30px;border-radius:12px}
h1{text-align:center}
.cards{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.card{width:250px;background:#f8f8f8;border-radius:10px;overflow:hidden;box-shadow:0 4px 12px #bbb}
.card img{width:100%;height:160px;object-fit:cover}
.card-content{padding:20px}
button{background:#333;color:white;border:0;padding:10px 15px;border-radius:5px}
.navigation{margin-top:30px;display:flex;justify-content:space-between}
a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
</style>
</head>
<body>
<div class="container">
<h1>Flexbox Card Layout</h1>
<div class="cards">
<div class="card">
<img src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=600&q=80">
<div class="card-content"><h2>Web Design</h2><p>Learn modern web design.</p><button>Learn More</button></div>
</div>
<div class="card">

</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=600&q=80">

</div>
</div>
