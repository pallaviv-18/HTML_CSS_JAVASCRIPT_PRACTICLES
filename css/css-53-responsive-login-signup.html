<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CSS 53 - Responsive Login Signup</title>
<style>
body{font-family:Arial;background:#eaf0f6;margin:0;padding:30px}
.container{max-width:800px;margin:auto;background:white;padding:30px;border-radius:12px}
.forms{display:flex;gap:30px}.form{flex:1}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:12px;background:#333;color:white;border:0;border-radius:5px}
.navigation{margin-top:30px;display:flex;justify-content:space-between}
a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
@media(max-width:650px){.forms{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<h1>Login and Signup</h1>
<div class="forms">
<div class="form">
<h2>Login</h2>
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button>Login</button>
</div>
<div class="form">
<h2>Sign Up</h2>
<input type="text" placeholder="Full Name">
<input type="email" placeholder="Email">
<input type="password" placeholder="Password">
<button>Sign Up</button>
</div>
</div>

<a href="css-52-responsive-footer.html">← Previous</a>
<a href="index.html">CSS Programs</a>
<a href="css-54-responsive-contact.html">Next →</a>
</div>
</div>
</body>
</html>
