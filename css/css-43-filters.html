<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 43 - Filters</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .filter-box {
            text-align: center;
        }

        .filter-box img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .normal img {
            filter: none;
        }

        .grayscale img {
            filter: grayscale(100%);
        }

        .blur img {
            filter: blur(3px);
        }

        .brightness img {
            filter: brightness(150%);
        }

        .sepia img {
            filter: sepia(100%);
        }

        .contrast img {
            filter: contrast(180%);
        }

        .filter-box p {
            font-weight: bold;
            margin-top: 10px;
        }

        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }

        .navigation a {
            background: #333;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CSS Experiment 43 - Filters</h1>

    <p class="description">
        Different CSS filter effects applied to images.
    </p>

    <div class="gallery">

        <div class="filter-box normal">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                 alt="Normal">
            <p>Normal</p>
        </div>

        <div class="filter-box grayscale">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                 alt="Grayscale">
            <p>Grayscale</p>
        </div>

        <div class="filter-box blur">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                 alt="Blur">
            <p>Blur</p>
        </div>

        <div class="filter-box brightness">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                 alt="Brightness">
            <p>Brightness</p>
        </div>

        <div class="filter-box sepia">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                 alt="Sepia">
            <p>Sepia</p>
        </div>

        <div class="filter-box contrast">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                 alt="Contrast">
            <p>Contrast</p>
        </div>

    </div>

    <div class="navigation">
        <a href="css-42-button-hover.html">← Previous</a>
        <a href="index.html">CSS Programs</a>
        <a href="css-44-object-fit.html">Next →</a>
    </div>

</div>

</body>
</html>
