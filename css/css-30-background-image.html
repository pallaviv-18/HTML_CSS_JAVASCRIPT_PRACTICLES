<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Images</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 500px;
            background-image:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url("https://picsum.photos/1200/700");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        .content {
            max-width: 600px;
            padding: 20px;
        }

        .content h1 {
            font-size: 50px;
        }

        .content p {
            font-size: 20px;
        }

        @media (max-width: 600px) {
            .hero {
                height: 400px;
            }

            .content h1 {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

<div class="hero">

    <div class="content">
        <h1>Beautiful Background</h1>
        <p>
            This page demonstrates background image,
            position, size and repeat properties.
        </p>
    </div>

</div>

</body>
</html>
