body{font-family:Arial;background:#f4f6f8;padding:30px;text-align:center}
.box{width:120px;height:120px;background:#3498db;margin:80px auto;animation:move 3s infinite alternate}
@keyframes move{
0%{transform:translateX(-150px);border-radius:0}
50%{transform:translateX(0);border-radius:50%}
100%{transform:translateX(150px);border-radius:0}
}

a{background:#333;color:white;padding:10px 15px;text-decoration:none;border-radius:5px}
