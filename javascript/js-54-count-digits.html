<!DOCTYPE html>
<html>
<head>
    <title>JS 54 - Count Digits</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 450px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Count Digits</h1>

    <input type="number" id="num" placeholder="Enter number">
    <br>

    <button onclick="countDigits()">Count</button>

    <p id="result"></p>
</div>

<script>
function countDigits() {
    let num = Math.abs(
        Number(document.getElementById("num").value)
    );

    let count = num === 0 ? 1 : String(num).length;

    document.getElementById("result").textContent =
        "Number of digits = " + count;
}
</script>

</body>
</html>
