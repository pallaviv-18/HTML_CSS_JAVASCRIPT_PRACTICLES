<!DOCTYPE html>
<html>
<head>
    <title>Student Marks and Grade Calculator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<h2>Student Marks / Grade Calculator</h2>

<input type="number" id="mark1" placeholder="Subject 1">
<input type="number" id="mark2" placeholder="Subject 2">
<input type="number" id="mark3" placeholder="Subject 3">
<input type="number" id="mark4" placeholder="Subject 4">
<input type="number" id="mark5" placeholder="Subject 5">

<br>

<button onclick="calculateGrade()">Calculate</button>

<div id="result"></div>

<script>
    function calculateGrade() {
        const marks = [
            Number(document.getElementById("mark1").value),
            Number(document.getElementById("mark2").value),
            Number(document.getElementById("mark3").value),
            Number(document.getElementById("mark4").value),
            Number(document.getElementById("mark5").value)
        ];

        if (marks.some(mark => mark < 0 || mark > 100)) {
            alert("Enter marks between 0 and 100.");
            return;
        }

        const total = marks.reduce((sum, mark) => sum + mark, 0);
        const average = total / marks.length;

        let grade;

        if (average >= 90) {
            grade = "A+";
        } else if (average >= 80) {
            grade = "A";
        } else if (average >= 70) {
            grade = "B";
        } else if (average >= 60) {
            grade = "C";
        } else if (average >= 50) {
            grade = "D";
        } else {
            grade = "F";
        }

        document.getElementById("result").innerHTML =
            "Total Marks: " + total +
            "<br>Average: " + average.toFixed(2) +
            "<br>Grade: " + grade;
    }
</script>

<p>
    <a href="../../index.html">Home</a> |
    <a href="../index.html">JavaScript Programs</a>
</p>

</body>
</html>
