<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 60px;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px;
            margin-left: 5px;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>Weather App</h2>

<p>Enter latitude and longitude:</p>

<input type="number" id="latitude" placeholder="Latitude">
<input type="number" id="longitude" placeholder="Longitude">

<button onclick="getWeather()">Get Weather</button>

<div id="result"></div>

<script>
    async function getWeather() {
        const latitude = document.getElementById("latitude").value;
        const longitude = document.getElementById("longitude").value;

        if (!latitude || !longitude) {
            alert("Enter latitude and longitude");
            return;
        }

        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,wind_speed_10m`;

        try {
            const response = await fetch(url);
            const data = await response.json();

            document.getElementById("result").innerHTML =
                `<h3>Current Weather</h3>
                 <p>Temperature: ${data.current.temperature_2m}°C</p>
                 <p>Wind Speed: ${data.current.wind_speed_10m} km/h</p>`;
        } catch (error) {
            document.getElementById("result").innerHTML =
                "Unable to get weather data.";
        }
    }
</script>

<p>
    <a href="../../index.html">Home</a> |
    <a href="../index.html">JavaScript Programs</a>
</p>

</body>
</html>
