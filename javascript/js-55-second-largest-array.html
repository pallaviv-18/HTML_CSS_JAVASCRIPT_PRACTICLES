<!DOCTYPE html>
<html>
<head>
    <title>JS 55 - Second Largest</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 40px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Second Largest Element</h1>

    <input id="arr" placeholder="10,25,5,40,30">

    <br>

    <button onclick="findSecondLargest()">Find</button>

    <p id="result"></p>
</div>

<script>
function findSecondLargest() {
    let arr = document.getElementById("arr")
        .value.split(",")
        .map(Number);

    let unique = [...new Set(arr)];
    unique.sort((a, b) => b - a);

    if (unique.length < 2) {
        document.getElementById("result").textContent =
            "Need at least two different numbers.";
        return;
    }

    document.getElementById("result").textContent =
        "Second Largest = " + unique[1];
}
</script>

</body>
</html>
