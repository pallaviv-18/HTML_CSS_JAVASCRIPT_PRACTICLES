<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        #player {
            width: 50px;
            height: 50px;
            background-color: royalblue;
            position: relative;
            left: 0;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <a href="../../index.html">Home</a> |
    <a href="../index.html">JavaScript Programs</a>

    <h1>Keyboard Game</h1>

    <p>Use the Left and Right Arrow keys to move the box.</p>

    <div id="player"></div>

    <script>
        const player = document.getElementById("player");
        let position = 0;

        document.addEventListener("keydown", function(event) {

            if (event.key === "ArrowRight") {
                position += 10;
            }

            if (event.key === "ArrowLeft") {
                position -= 10;
            }

            if (position < 0) {
                position = 0;
            }

            if (position > window.innerWidth - 70) {
                position = window.innerWidth - 70;
            }

            player.style.left = position + "px";
        });
    </script>

</body>
</html>
