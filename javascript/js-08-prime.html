<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 08 - Prime Number</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 35px;
            max-width: 450px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            padding: 12px;
            width: 80%;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Prime Number Checker</h1>

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="checkPrime()">Check Prime</button>

    <div id="result"></div>
</div>

<script>
    function checkPrime() {
        let number = Number(document.getElementById("number").value);
        let isPrime = true;

        if (number < 2 || !Number.isInteger(number)) {
            isPrime = false;
        } else {
            for (let i = 2; i <= Math.sqrt(number); i++) {
                if (number % i === 0) {
                    isPrime = false;
                    break;
                }
            }
        }

        if (isPrime) {
            document.getElementById("result").textContent =
                number + " is a Prime Number.";
        } else {
            document.getElementById("result").textContent =
                number + " is not a Prime Number.";
        }
    }
</script>

</body>
</html>
