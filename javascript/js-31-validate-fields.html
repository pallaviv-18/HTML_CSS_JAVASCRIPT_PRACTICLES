<!DOCTYPE html>
<html>
<head><title>JS 31 - Validate Fields</title></head>
<body style="font-family:Arial;padding:40px">

<h1>Field Validation</h1>

<input id="name" placeholder="Name"><br><br>
<input id="email" placeholder="Email"><br><br>
<input id="phone" placeholder="10-digit phone"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="validate()">Validate</button>
<p id="result"></p>

<script>
function validate(){
    let name=document.getElementById("name").value.trim();
    let email=document.getElementById("email").value.trim();
    let phone=document.getElementById("phone").value.trim();
    let password=document.getElementById("password").value;

    if(name==="") return result("Enter name.");
    if(!/^[^ ]+@[^ ]+\.[^ ]+$/.test(email)) return result("Invalid email.");
    if(!/^\d{10}$/.test(phone)) return result("Invalid phone number.");
    if(password.length<6) return result("Password must contain at least 6 characters.");

    result("All details are valid!");
}

function result(message){
    document.getElementById("result").textContent=message;
}
</script>

</body>
</html>
