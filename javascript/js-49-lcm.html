<!DOCTYPE html>
<html>
<head><title>JS 49 - LCM</title></head>
<body style="font-family:Arial;text-align:center;padding:50px">

<h1>LCM of Two Numbers</h1>

<input type="number" id="a" placeholder="First number">
<input type="number" id="b" placeholder="Second number">
<button onclick="findLCM()">Find LCM</button>

<p id="result"></p>

<script>
function gcd(a,b){
    while(b!==0){
        let temp=b;
        b=a%b;
        a=temp;
    }
    return Math.abs(a);
}

function findLCM(){
    let a=Number(document.getElementById("a").value);
    let b=Number(document.getElementById("b").value);

    let lcm=Math.abs(a*b)/gcd(a,b);

    document.getElementById("result").textContent="LCM = "+lcm;
}
</script>

</body>
</html>
