<!DOCTYPE html>
<html>
<head>
    <title>JS 62 - Vowels and Consonants</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Vowels and Consonants</h1>

    <input id="text" placeholder="Enter text">

    <br>

    <button onclick="countLetters()">Count</button>

    <p id="result"></p>
</div>

<script>
function countLetters() {
    let text = document.getElementById("text").value.toLowerCase();

    let vowels = 0;
    let consonants = 0;

    for (let char of text) {
        if (/[a-z]/.test(char)) {
            if ("aeiou".includes(char)) {
                vowels++;
            } else {
                consonants++;
            }
        }
    }

    document.getElementById("result").innerHTML =
        "Vowels: " + vowels +
        "<br>Consonants: " + consonants;
}
</script>

<br>

</body>
</html>
