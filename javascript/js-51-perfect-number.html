<!DOCTYPE html>
<html>
<head>
    <title>JS 51 - Perfect Number</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 450px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }

        #result {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Perfect Number</h1>

    <input type="number" id="num" placeholder="Enter number">
    <br>

    <button onclick="checkPerfect()">Check</button>

    <p id="result"></p>
</div>

<script>
function checkPerfect() {
    let num = Number(document.getElementById("num").value);
    let sum = 0;

    for (let i = 1; i < num; i++) {
        if (num % i === 0) {
            sum += i;
        }
    }

    document.getElementById("result").textContent =
        sum === num && num > 0
        ? num + " is a Perfect Number."
        : num + " is not a Perfect Number.";
}
</script>

</body>
</html>
