<!DOCTYPE html>
<html>
<head>
<title>JS 19 - Objects</title>
<style>
body{font-family:Arial;text-align:center;padding:40px;background:#f4f7fb}
.box{background:white;padding:30px;max-width:500px;margin:auto;border-radius:15px}
button{padding:12px;background:#2563eb;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<div class="box">
<h1>JavaScript Objects</h1>
<button onclick="showObject()">Display Object</button>
<p id="result"></p>
</div>

<script>
function showObject(){
    let student={
        name:"Pallavi",
        age:20,
        course:"B.Tech"
    };

    document.getElementById("result").innerHTML=
        "Name: "+student.name+
        "<br>Age: "+student.age+
        "<br>Course: "+student.course;
}
</script>

</body>
</html>
