<!DOCTYPE html>
<html>
<head>
    <title>JS 66 - Email Regex</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        input {
            width: 80%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Email Validation</h1>

    <input id="email" type="text" placeholder="Enter email">

    <br>

    <button onclick="validateEmail()">Validate</button>

    <p id="result"></p>
</div>

<script>
function validateEmail() {
    let email = document.getElementById("email").value;

    let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    document.getElementById("result").textContent =
        pattern.test(email)
        ? "Valid Email Address."
        : "Invalid Email Address.";
}
</script>

</body>
</html>
