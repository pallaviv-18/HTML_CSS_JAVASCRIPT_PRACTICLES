<!DOCTYPE html>
<html>
<head>
<title>JS 16 - Arrow Functions</title>
<style>
body{font-family:Arial;text-align:center;padding:50px;background:#f4f7fb}
.box{background:white;padding:30px;max-width:450px;margin:auto;border-radius:15px}
button{padding:12px;background:#2563eb;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<div class="box">
<h1>Arrow Functions</h1>
<button onclick="showResult()">Run</button>
<p id="result"></p>
</div>

<script>
const add=(a,b)=>a+b;
const square=n=>n*n;

function showResult(){
    document.getElementById("result").innerHTML=
        "Addition: "+add(5,10)+"<br>Square: "+square(6);
}
</script>
