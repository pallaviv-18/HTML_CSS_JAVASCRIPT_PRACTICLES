<!DOCTYPE html>
<html>
<head>
    <title>JS 63 - Word Count</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 550px;
            margin: auto;
            border-radius: 15px;
        }

        textarea {
            width: 90%;
            height: 100px;
            padding: 10px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Word Count</h1>

    <textarea id="text" placeholder="Enter a sentence"></textarea>

    <br>

    <button onclick="countWords()">Count Words</button>

    <p id="result"></p>
</div>

<script>
function countWords() {
    let text = document.getElementById("text").value.trim();

    let count = text === "" ? 0 : text.split(/\s+/).length;

    document.getElementById("result").textContent =
        "Number of words: " + count;
}
</script>

</body>
</html>
