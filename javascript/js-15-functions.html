<!DOCTYPE html>
<html>
<head>
<title>JS 15 - Functions</title>
<style>
body{font-family:Arial;text-align:center;padding:50px;background:#f4f7fb}
.box{background:white;padding:30px;max-width:450px;margin:auto;border-radius:15px}
button{padding:12px;background:#2563eb;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<div class="box">
<h1>JavaScript Functions</h1>
<button onclick="showResult()">Call Function</button>
<p id="result"></p>
</div>

<script>
function add(a,b){
    return a+b;
}

function showResult(){
    document.getElementById("result").textContent=
        "Result of add(10, 20) = "+add(10,20);
}
</script>

</body>
