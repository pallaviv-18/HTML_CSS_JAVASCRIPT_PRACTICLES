<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .box {
            margin: 10px;
            padding: 15px;
            background-color: lightyellow;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <a href="../../index.html">Home</a> |
    <a href="../index.html">JavaScript Programs</a>

    <h1 id="title">Query Selector</h1>

    <p class="box">Paragraph 1</p>
    <p class="box">Paragraph 2</p>
    <p class="box">Paragraph 3</p>

    <button onclick="selectElements()">Select Elements</button>

    <script>
        function selectElements() {
            const firstBox = document.querySelector(".box");
            firstBox.style.color = "red";

            const allBoxes = document.querySelectorAll(".box");

            allBoxes.forEach(function(box) {
                box.style.border = "2px solid blue";
            });
        }
    </script>

</body>
</html>
