<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Elements</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        li {
            margin: 10px;
        }
    </style>
</head>
<body>

    <a href="../../index.html">Home</a> |
    <a href="../index.html">JavaScript Programs</a>

    <h1>Remove Elements</h1>

    <ul id="itemList">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <button onclick="removeItem()">Remove Last Item</button>

    <script>
        function removeItem() {
            const list = document.getElementById("itemList");

            if (list.lastElementChild) {
                list.removeChild(list.lastElementChild);
            }
        }
    </script>

</body>
</html>
