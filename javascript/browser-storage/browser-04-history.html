<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <a href="../../index.html">Home</a> |
    <a href="../index.html">JavaScript Programs</a>

    <h1>History Object</h1>

    <p>Number of pages in browser history:</p>
    <h2 id="count"></h2>

    <button onclick="goBack()">Go Back</button>
    <button onclick="goForward()">Go Forward</button>

    <script>
        document.getElementById("count").textContent =
            history.length;

        function goBack() {
            history.back();
        }

        function goForward() {
            history.forward();
        }
    </script>

</body>
</html>
