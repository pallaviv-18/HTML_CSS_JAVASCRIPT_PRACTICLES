<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator Object</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        button {
            padding: 10px 20px;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <a href="../../index.html">Home</a> |
    <a href="../index.html">JavaScript Programs</a>

    <h1>Navigator Object</h1>

    <button onclick="showNavigatorInfo()">Show Browser Information</button>

    <div id="result"></div>

    <script>
        function showNavigatorInfo() {
            const result = document.getElementById("result");

            result.innerHTML =
                "Browser: " + navigator.appName + "<br>" +
                "Platform: " + navigator.platform + "<br>" +
                "Language: " + navigator.language + "<br>" +
                "Online: " + navigator.onLine + "<br>" +
                "User Agent: " + navigator.userAgent;
        }
    </script>

</body>
</html>
