<!DOCTYPE html>
<html>
<head>
    <title>JS 61 - String Palindrome</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 450px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>String Palindrome</h1>

    <input id="text" placeholder="Enter word">

    <br>

    <button onclick="checkPalindrome()">Check</button>

    <p id="result"></p>
</div>

<script>
function checkPalindrome() {
    let text = document.getElementById("text").value
        .toLowerCase()
        .replace(/\s/g, "");

    let reversed = text.split("").reverse().join("");

    document.getElementById("result").textContent =
        text === reversed
        ? "It is a Palindrome."
        : "It is not a Palindrome.";
}
</script>

</body>
</html>
