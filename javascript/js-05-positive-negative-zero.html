<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 05 - Positive Negative Zero</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 35px;
            max-width: 450px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            padding: 12px;
            width: 80%;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Positive, Negative or Zero</h1>

    <input type="number" id="number" placeholder="Enter a number">

    <br>

    <button onclick="checkNumber()">Check Number</button>

    <div id="result"></div>
</div>

<script>
    function checkNumber() {
        let number = Number(document.getElementById("number").value);
        let result = "";

        if (number > 0) {
            result = "The number is Positive.";
        } else if (number < 0) {
            result = "The number is Negative.";
        } else {
            result = "The number is Zero.";
        }

        document.getElementById("result").textContent = result;
    }
</script>

</body>
</html>
