<!DOCTYPE html>
<html>
<head>
<title>JS 12 - Largest Smallest Array</title>
<style>
body{font-family:Arial;text-align:center;background:#f4f7fb;padding:40px}
.box{background:white;padding:30px;max-width:500px;margin:auto;border-radius:15px}
input,button{padding:12px;margin:8px}
button{background:#2563eb;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<div class="box">
<h1>Largest & Smallest Array Element</h1>
<input id="arr" placeholder="Example: 10,5,30,2,8">
<br>
<button onclick="findValues()">Find</button>
<p id="result"></p>
</div>

<script>
function findValues(){
    let arr=document.getElementById("arr").value.split(",").map(Number);
    document.getElementById("result").innerHTML=
        "Largest: "+Math.max(...arr)+"<br>Smallest: "+Math.min(...arr);
}
</script>
<br>

</body>
</html>
