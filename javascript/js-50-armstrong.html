<!DOCTYPE html>
<html>
<head>
<title>JS 50 - Armstrong Number</title>
<style>
body{font-family:Arial;text-align:center;padding:50px;background:#f4f7fb}
.box{background:white;padding:30px;max-width:450px;margin:auto;border-radius:15px}
input,button{padding:12px;margin:8px}
button{background:#2563eb;color:white;border:0;border-radius:7px}
#result{font-weight:bold;margin:15px}
</style>
</head>
<body>

<div class="box">
<h1>Armstrong Number</h1>

<input type="number" id="num" placeholder="Enter number">
<br>
<button onclick="checkArmstrong()">Check</button>

<p id="result"></p>
</div>

<script>
function checkArmstrong(){
    let num=Number(document.getElementById("num").value);
    let original=num;
    let digits=String(num).length;
    let sum=0;

    while(num>0){
        let digit=num%10;
        sum+=Math.pow(digit,digits);
        num=Math.floor(num/10);
    }

    document.getElementById("result").textContent=
        sum===original
        ? original+" is an Armstrong Number."
        : original+" is not an Armstrong Number.";
}
</script>

</body>
</html>
