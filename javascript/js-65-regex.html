<!DOCTYPE html>
<html>
<head>
    <title>JS 65 - Regular Expression</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Regular Expression</h1>

    <input id="text" placeholder="Enter text">

    <br>

    <button onclick="testRegex()">Test</button>

    <p id="result"></p>
</div>

<script>
function testRegex() {
    let text = document.getElementById("text").value;

    // Checks whether the text contains only letters
    let pattern = /^[A-Za-z]+$/;

    document.getElementById("result").textContent =
        pattern.test(text)
        ? "Valid: Contains only letters."
        : "Invalid: Use letters only.";
}
</script>

</body>
</html>
