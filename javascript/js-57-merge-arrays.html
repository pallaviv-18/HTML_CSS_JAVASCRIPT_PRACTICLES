<!DOCTYPE html>
<html>
<head>
    <title>JS 57 - Merge Arrays</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: #f4f7fb;
        }

        .box {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 15px;
        }

        input, button {
            padding: 12px;
            margin: 8px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Merge Two Arrays</h1>

    <input id="arr1" placeholder="Array 1: 1,2,3">
    <input id="arr2" placeholder="Array 2: 4,5,6">

    <br>

    <button onclick="mergeArrays()">Merge</button>

    <p id="result"></p>
</div>

<script>
function mergeArrays() {
    let a = document.getElementById("arr1").value.split(",");
    let b = document.getElementById("arr2").value.split(",");

    let merged = [...a, ...b];

    document.getElementById("result").textContent =
        "Merged Array: " + merged.join(", ");
}
</script>

</body>
</html>
