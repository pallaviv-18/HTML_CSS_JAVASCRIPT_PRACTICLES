<!DOCTYPE html>
<html>
<head>
<title>JS 20 - Date and Math</title>
<style>
body{font-family:Arial;text-align:center;padding:40px;background:#f4f7fb}
.box{background:white;padding:30px;max-width:500px;margin:auto;border-radius:15px}
button{padding:12px;background:#2563eb;color:white;border:0;border-radius:7px}
</style>
</head>
<body>
<div class="box">
<h1>Date and Math Objects</h1>
<button onclick="showData()">Show Data</button>
<p id="result"></p>
</div>

<script>
function showData(){
    let date=new Date();
    document.getElementById("result").innerHTML=
        "Current Date: "+date.toLocaleDateString()+
        "<br>Current Time: "+date.toLocaleTimeString()+
        "<br>Square Root of 25: "+Math.sqrt(25)+
        "<br>Random Number: "+Math.random().toFixed(3);
}
</script>

</body>
</html>
