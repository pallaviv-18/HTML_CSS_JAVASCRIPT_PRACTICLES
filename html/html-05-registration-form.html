<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Experiment 5 - Student Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            line-height: 1.6;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #e53935, #b71c1c);
            color: white;
            padding: 25px 8%;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* Navigation */
        nav {
            margin-top: 15px;
        }

        nav a {
            display: inline-block;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 15px;
            border-radius: 6px;
            margin-right: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            background: white;
            color: #b71c1c;
        }

        /* Main */
        main {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .form-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h2 {
            color: #b71c1c;
            font-size: 27px;
        }

        .title p {
            color: #666;
            margin-top: 5px;
        }

        /* Form */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #e53935;
            box-shadow: 0 0 0 2px rgba(229, 57, 53, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Radio buttons */
        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
        }

        .radio-option input {
            width: auto;
        }

        /* Checkbox */
        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0;
            font-size: 14px;
            color: #555;
        }

        .terms input {
            width: auto;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 11px 25px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn {
            background: #b71c1c;
            color: white;
        }

        .submit-btn:hover {
            background: #e53935;
        }

        .reset-btn {
            background: #eee;
            color: #333;
        }

        .reset-btn:hover {
            background: #ddd;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 650px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 23px;
            }

            main {
                width: 94%;
            }

            .form-container {
                padding: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .radio-group {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>

        <h1>HTML Practical Lab</h1>
        <p>Experiment 05 — Student Registration Form</p>

        <nav>
            <a href="../index.html">Home</a>
            <a href="index.html">Back to Programs</a>
        </nav>

    </header>


    <!-- Main Content -->
    <main>

        <div class="form-container">

            <div class="title">
                <h2>Student Registration Form</h2>
                <p>Enter your details to complete the registration</p>
            </div>


            <form>

                <!-- Name and Roll Number -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="name">Full Name</label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="roll">Roll Number</label>

                        <input
                            type="text"
                            id="roll"
                            name="roll"
                            placeholder="Enter roll number"
                            required
                        >
                    </div>

                </div>


                <!-- Email and Phone -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="phone">Phone Number</label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            required
                        >
                    </div>

                </div>


                <!-- Date of Birth and Course -->
                <div class="form-row">

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>

                        <input
                            type="date"
                            id="dob"
                            name="dob"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="course">Course</label>

                        <select id="course" name="course" required>

                            <option value="">Select Course</option>
                            <option value="cse">Computer Science Engineering</option>
                            <option value="it">Information Technology</option>
                            <option value="ece">Electronics and Communication</option>
                            <option value="aiml">Artificial Intelligence & ML</option>
                            <option value="eee">Electrical Engineering</option>

                        </select>

                    </div>

                </div>


                <!-- Gender -->
                <div class="form-row">

                    <div class="form-group">

                        <label>Gender</label>

                        <div class="radio-group">

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="male"
                                    required
                                >
                                Male
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="female"
                                >
                                Female
                            </label>

                            <label class="radio-option">
                                <input
                                    type="radio"
                                    name="gender"
                                    value="other"
                                >
                                Other
                            </label>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="year">Year of Study</label>

                        <select id="year" name="year" required>

                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>

                        </select>

                    </div>

                </div>


                <!-- Address -->
                <div class="form-row">

                    <div class="form-group full">

                        <label for="address">Address</label>

                        <textarea
                            id="address"
                            name="address"
                            placeholder="Enter your address"
                            required
                        ></textarea>

                    </div>

                </div>


                <!-- Terms -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>

                </div>


                <!-- Buttons -->
                <div class="buttons">

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        Register
                    </button>

                    <button
                        type="reset"
                        class="reset-btn"
                    >
                        Reset
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        HTML Practical Lab &copy; 2026
    </footer>

</body>

</html>
