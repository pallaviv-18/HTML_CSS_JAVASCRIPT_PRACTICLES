<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Experiment 9 - HTML5 Input Types</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #b31217, #e52d27);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }

        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .experiment-title {
            text-align: center;
            margin-bottom: 25px;
            color: #b31217;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e52d27;
            box-shadow: 0 0 5px rgba(229, 45, 39, 0.3);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn {
            background: #b31217;
            color: white;
        }

        .reset-btn {
            background: #ddd;
            color: #333;
        }

        button:hover {
            opacity: 0.85;
        }

        .navigation {
            text-align: center;
            margin-top: 30px;
        }

        .navigation a {
            display: inline-block;
            text-decoration: none;
            background: #333;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
        }

        .navigation a:hover {
            background: #b31217;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }

            header h1 {
                font-size: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>HTML5 Input Types</h1>
        <p>Experiment 9 - Email, Date, Number and Password</p>
    </header>

    <div class="container">

        <h2 class="experiment-title">Registration Form</h2>

        <form>

            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email Address:</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Date Input -->
            <div class="form-group">
                <label for="dob">Date of Birth:</label>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required
                >
            </div>

            <!-- Number Input -->
            <div class="form-group">
                <label for="age">Age:</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    min="1"
                    max="100"
                    placeholder="Enter your age"
                    required
                >
            </div>

            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password:</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">
                    Submit
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

        <div class="navigation">
            <a href="../index.html">Home</a>
            <a href="index.html">Back to Programs</a>
        </div>

    </div>

    <footer>
        <p>HTML Practical Lab | Experiment 9</p>
    </footer>

</body>
</html>
